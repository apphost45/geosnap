<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoSnap Pro - Manual Override</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* v11.0 Manual Note Support */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Roboto', sans-serif; background: #000; }
        #camera-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .mirror-mode { transform: scaleX(-1) !important; }
        #overlay-layer { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0, 0, 0, 0.5); color: white; padding: 18px; box-sizing: border-box; z-index: 2; display: flex; align-items: center; }
        #map-box { width: 100px; height: 100px; background: #eee; border-radius: 6px; margin-right: 15px; flex-shrink: 0; position: relative; overflow: hidden; border: 2px solid rgba(255,255,255,0.4); }
        #map-img { width: 100%; height: 100%; object-fit: cover; }
        #map-pin { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%); color: red; font-size: 26px; }
        #info-box { flex-grow: 1; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); overflow: hidden; }
        .loc-title { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 2px; }
        .loc-detail { font-size: 16px; color: #eee; margin-bottom: 3px; }
        .loc-coords { font-size: 14px; color: #ccc; font-family: monospace; }
        .loc-date { font-size: 14px; color: #FFD700; font-weight: 700; margin-top: 3px; }
        #controls { position: absolute; bottom: 150px; width: 100%; display: flex; justify-content: center; align-items: center; z-index: 3; pointer-events: none; }
        #snap-btn { width: 80px; height: 80px; border-radius: 50%; background: white; border: 5px solid rgba(255,255,255,0.3); cursor: pointer; pointer-events: auto; }
        #snap-btn.flash-pink { background-color: #FF007F !important; }
        .side-btn { width: 50px; height: 50px; background: rgba(0,0,0,0.6); border: 1px solid white; border-radius: 50%; color: white; font-size: 22px; display: flex; justify-content: center; align-items: center; cursor: pointer; pointer-events: auto; margin: 0 15px; }
        .side-btn.active { background: #FFD700; color: black; }
        #render-canvas, #watermark-logo { display: none; }
    </style>
</head>
<body>

    <video id="camera-view" autoplay playsinline></video>
    <img id="watermark-logo" src="https://cdn.jsdelivr.net/gh/mirzamunib24/my-images@main/rgrg.png" crossorigin="anonymous">

    <div id="overlay-layer">
        <div id="map-box"><img id="map-img"><div id="map-pin">📍</div></div>
        <div id="info-box">
            <div class="loc-title" id="disp-title">Tap '✎' for Place Name</div>
            <div class="loc-detail"><span id="disp-flag"></span> <span id="disp-address">Finding Address...</span></div>
            <div class="loc-coords" id="disp-coords">...</div>
            <div class="loc-date" id="disp-date">...</div>
        </div>
    </div>

    <div id="controls">
        <button id="note-btn" class="side-btn">✎</button>
        <button id="flash-btn" class="side-btn">⚡</button>
        <button id="snap-btn"></button>
        <button id="switch-btn" class="side-btn">🔄</button>
    </div>

    <canvas id="render-canvas"></canvas>

<script>
    const VIDEO = document.getElementById('camera-view');
    const CANVAS = document.getElementById('render-canvas');
    const CTX = CANVAS.getContext('2d');
    const WATERMARK_IMG = document.getElementById('watermark-logo');
    const FLASH_BTN = document.getElementById('flash-btn');
    const NOTE_BTN = document.getElementById('note-btn');
    
    let currentFacingMode = "environment";
    let state = { lat: 0, lng: 0, address: "", shortArea: "", countryCode: "pk", manualNote: "" };
    let videoTrack = null;
    let isFlashOn = false;

    async function startCamera() {
        try {
            if (VIDEO.srcObject) VIDEO.srcObject.getTracks().forEach(t => t.stop());
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode, width: { ideal: 4096 }, height: { ideal: 2160 } } });
            VIDEO.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
            const cap = videoTrack.getCapabilities();
            FLASH_BTN.style.display = cap.torch ? "flex" : "none";
            VIDEO.style.transform = (currentFacingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';
        } catch (err) { console.error(err); }
    }

    // --- MANUAL NOTE LOGIC ---
    NOTE_BTN.onclick = () => {
        const userInput = prompt("Enter Place Name (e.g., Cheema Colony, 79 Chak):", state.manualNote || "");
        if (userInput !== null) {
            state.manualNote = userInput;
            document.getElementById('disp-title').innerText = userInput || state.shortArea || "Location";
        }
    };

    FLASH_BTN.onclick = async () => {
        if (!videoTrack) return;
        isFlashOn = !isFlashOn;
        try {
            await videoTrack.applyConstraints({ advanced: [{ torch: isFlashOn }] });
            isFlashOn ? FLASH_BTN.classList.add('active') : FLASH_BTN.classList.remove('active');
        } catch (e) { isFlashOn = false; }
    };

    function init() {
        startCamera();
        if ("geolocation" in navigator) navigator.geolocation.watchPosition(successLoc, null, { enableHighAccuracy: true });
        setInterval(updateTime, 1000);
    }

    document.getElementById('switch-btn').onclick = () => {
        currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
        startCamera();
    };

    function successLoc(pos) {
        state.lat = pos.coords.latitude; state.lng = pos.coords.longitude;
        document.getElementById('disp-coords').innerText = `Lat ${state.lat.toFixed(6)} Long ${state.lng.toFixed(6)}`;
        
        const zoom = 15;
        const x = Math.floor((state.lng + 180) / 360 * Math.pow(2, zoom));
        const y = Math.floor((1 - Math.log(Math.tan(state.lat * Math.PI / 180) + 1 / Math.cos(state.lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom));
        const mapImg = document.getElementById('map-img');
        mapImg.crossOrigin = "anonymous"; mapImg.src = `https://tile.openstreetmap.org/${zoom}/${x}/${y}.png`;
        
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${state.lat}&lon=${state.lng}&addressdetails=1`)
            .then(r => r.json()).then(d => {
                const a = d.address;
                state.countryCode = a.country_code || 'pk';
                state.shortArea = a.neighbourhood || a.suburb || a.residential || a.village || a.hamlet || a.road || "Unknown Place";
                
                const city = a.city || a.town || a.county || "";
                state.address = `${state.shortArea}, ${city}`;

                // If user hasn't typed a manual note, show the automatic one
                if (!state.manualNote) {
                    document.getElementById('disp-title').innerText = state.shortArea;
                }
                document.getElementById('disp-address').innerText = state.address;
                document.getElementById('disp-flag').innerText = String.fromCodePoint(...state.countryCode.toUpperCase().split('').map(c => 127397 + c.charCodeAt()));
            });
    }

    function updateTime() {
        const n = new Date();
        document.getElementById('disp-date').innerText = `${n.toLocaleDateString('en-GB')} ${n.toLocaleTimeString('en-US')} ${n.toString().match(/GMT[\+\-]\d{4}/)[0]}`;
    }

    document.getElementById('snap-btn').onclick = function() {
        this.classList.add('flash-pink');
        setTimeout(async () => {
            await takePhoto();
            this.classList.remove('flash-pink');
        }, 100);
    };

    async function takePhoto() {
        let bitmap;
        try { bitmap = await (new ImageCapture(videoTrack)).grabFrame(); CANVAS.width = bitmap.width; CANVAS.height = bitmap.height; }
        catch (e) { CANVAS.width = VIDEO.videoWidth; CANVAS.height = VIDEO.videoHeight; }

        CTX.save();
        if (currentFacingMode === 'user') { CTX.translate(CANVAS.width, 0); CTX.scale(-1, 1); }
        bitmap ? CTX.drawImage(bitmap, 0, 0) : CTX.drawImage(VIDEO, 0, 0);
        CTX.restore();

        // Watermark Logo
        CTX.save(); CTX.globalAlpha = 0.5;
        const logoS = CANVAS.width * 0.15; const pad = CANVAS.width * 0.03;
        CTX.drawImage(WATERMARK_IMG, pad, pad, logoS, logoS);
        CTX.restore();

        // Overlay
        const boxH = CANVAS.height * 0.22; const yS = CANVAS.height - boxH;
        CTX.fillStyle = "rgba(0,0,0,0.55)"; CTX.fillRect(0, yS, CANVAS.width, boxH);

        const s = CANVAS.width / 1000;
        const mS = boxH * 0.75; const mX = 25 * s; const mY = yS + (boxH - mS) / 2;
        try { CTX.drawImage(document.getElementById('map-img'), mX, mY, mS, mS); } catch(e){}

        const tX = mX + mS + (25 * s);
        let tY = mY + (48 * s);
        CTX.fillStyle = "white"; CTX.shadowBlur = 4; CTX.shadowColor = "black";
        
        // Final Large Fonts
        CTX.font = `bold ${52 * s}px Roboto`;
        CTX.fillText(document.getElementById('disp-title').innerText, tX, tY);
        
        tY += (65 * s);
        CTX.font = `${32 * s}px Roboto`;
        CTX.fillText(document.getElementById('disp-address').innerText.substring(0, 45), tX, tY);

        tY += (55 * s);
        CTX.font = `${28 * s}px monospace`;
        CTX.fillText(document.getElementById('disp-coords').innerText, tX, tY);

        tY += (55 * s);
        CTX.font = `bold ${30 * s}px Roboto`;
        CTX.fillStyle = "#FFD700";
        CTX.fillText(document.getElementById('disp-date').innerText, tX, tY);

        const link = document.createElement('a');
        link.download = `GeoSnap_${Date.now()}.jpg`;
        link.href = CANVAS.toDataURL("image/jpeg", 1.0);
        link.click();
    }
    window.onload = init;
</script>
</body>
</html>
