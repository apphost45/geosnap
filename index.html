<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoSnap Night Vision</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* v8.0 Night Vision - Flash Added */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Roboto', sans-serif; background: #000; }
        
        #camera-view {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }
        .mirror-mode { transform: scaleX(-1) !important; }

        #overlay-layer {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.4); color: white; padding: 15px; box-sizing: border-box;
            z-index: 2; display: flex; align-items: center;
        }

        #map-box {
            width: 80px; height: 80px; background: #eee; border-radius: 4px;
            margin-right: 12px; flex-shrink: 0; position: relative; overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
        }
        #map-img { width: 100%; height: 100%; object-fit: cover; }
        #map-pin { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%); color: red; font-size: 24px; }

        #info-box { flex-grow: 1; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .loc-title { font-size: 18px; font-weight: 700; color: #fff; }
        .loc-detail { font-size: 12px; color: #ddd; }
        .loc-coords { font-size: 11px; color: #ccc; font-family: monospace; }
        .loc-date { font-size: 11px; color: #eebb00; font-weight: 500; }

        /* CONTROLS - Now with 3 Buttons */
        #controls { position: absolute; bottom: 130px; width: 100%; display: flex; justify-content: center; align-items: center; z-index: 3; pointer-events: none; }
        
        #snap-btn {
            width: 75px; height: 75px; border-radius: 50%;
            background: rgba(255,255,255,0.9); border: 4px solid rgba(255,255,255,0.3);
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: auto; -webkit-tap-highlight-color: transparent;
            margin: 0 30px; /* Space between buttons */
        }
        #snap-btn.flash-pink { background-color: #FF007F !important; transform: scale(0.90); }
        
        /* Side Buttons (Flash & Switch) */
        .side-btn {
            width: 50px; height: 50px; background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
            color: white; font-size: 24px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent;
        }
        .side-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }
        .side-btn.active { background: #FFD700; color: black; border-color: #FFD700; } /* Yellow for Flash On */

        #perm-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        .hidden { display: none !important; }
        #render-canvas, #watermark-logo { display: none; }
    </style>
</head>
<body>

    <video id="camera-view" autoplay playsinline></video>
    <img id="watermark-logo" src="https://cdn.jsdelivr.net/gh/mirzamunib24/my-images@main/rgrg.png" crossorigin="anonymous">

    <div id="perm-modal">
        <h2>⚠️ Location Needed</h2>
        <button style="padding:10px 20px; margin-top:10px;" onclick="startCamera()">Enable Camera & GPS</button>
    </div>

    <div id="overlay-layer">
        <div id="map-box"><img id="map-img"><div id="map-pin">📍</div></div>
        <div id="info-box">
            <div class="loc-title" id="disp-title">Finding...</div>
            <div class="loc-detail"><span id="disp-flag"></span> <span id="disp-address">...</span></div>
            <div class="loc-coords" id="disp-coords">...</div>
            <div class="loc-date" id="disp-date">...</div>
        </div>
    </div>

    <div id="controls">
        <button id="flash-btn" class="side-btn">⚡</button>
        <button id="snap-btn"></button>
        <button id="switch-btn" class="side-btn">🔄</button>
    </div>

    <canvas id="render-canvas"></canvas>

<script>
    const VIDEO = document.getElementById('camera-view');
    const CANVAS = document.getElementById('render-canvas');
    const CTX = CANVAS.getContext('2d');
    const WATERMARK_IMG = document.getElementById('watermark-logo');
    const FLASH_BTN = document.getElementById('flash-btn');
    
    let currentFacingMode = "environment";
    let state = { lat: 0, lng: 0, address: "", shortArea: "", countryCode: "pk", mapUrl: "" };
    let videoTrack = null;
    let isFlashOn = false;

    async function startCamera() {
        try {
            if (VIDEO.srcObject) VIDEO.srcObject.getTracks().forEach(t => t.stop());
            
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: currentFacingMode,
                    width: { min: 1280, ideal: 4096, max: 8192 },
                    height: { min: 720, ideal: 3072, max: 8192 }
                }
            });
            
            VIDEO.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
            
            // Check Flash Support
            const capabilities = videoTrack.getCapabilities();
            if (capabilities.torch) {
                FLASH_BTN.style.display = "flex"; // Show button
            } else {
                FLASH_BTN.style.display = "none"; // Hide if no flash (e.g. front camera)
            }
            // Reset Flash UI
            isFlashOn = false;
            FLASH_BTN.classList.remove('active');

            VIDEO.style.transform = (currentFacingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';
            document.getElementById('perm-modal').classList.add('hidden');
        } catch (err) { alert("Camera Error: " + err.message); }
    }

    // --- FLASH TOGGLE LOGIC ---
    FLASH_BTN.onclick = async () => {
        if (!videoTrack) return;
        isFlashOn = !isFlashOn;
        try {
            await videoTrack.applyConstraints({
                advanced: [{ torch: isFlashOn }]
            });
            // Update Button UI
            if (isFlashOn) FLASH_BTN.classList.add('active');
            else FLASH_BTN.classList.remove('active');
        } catch (e) {
            alert("Flash failed: " + e.message);
            isFlashOn = false;
        }
    };

    function init() {
        startCamera();
        if ("geolocation" in navigator) navigator.geolocation.watchPosition(successLoc, null, { enableHighAccuracy: true });
        setInterval(updateTime, 1000);
    }

    document.getElementById('switch-btn').onclick = () => {
        currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
        startCamera();
    };

    function successLoc(pos) {
        state.lat = pos.coords.latitude; state.lng = pos.coords.longitude;
        document.getElementById('disp-coords').innerText = `Lat ${state.lat.toFixed(6)} Long ${state.lng.toFixed(6)}`;
        const zoom = 15;
        const x = Math.floor((state.lng + 180) / 360 * Math.pow(2, zoom));
        const y = Math.floor((1 - Math.log(Math.tan(state.lat * Math.PI / 180) + 1 / Math.cos(state.lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom));
        state.mapUrl = `https://tile.openstreetmap.org/${zoom}/${x}/${y}.png`;
        const mapImg = document.getElementById('map-img');
        mapImg.crossOrigin = "anonymous"; mapImg.src = state.mapUrl;
        
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${state.lat}&lon=${state.lng}`)
            .then(r => r.json()).then(d => {
                const a = d.address;
                state.countryCode = a.country_code || 'pk';
                state.shortArea = a.city || a.town || a.village || "Area";
                state.address = d.display_name.split(",").slice(0, 4).join(",");
                document.getElementById('disp-title').innerText = state.shortArea + ", " + (a.state || a.country);
                document.getElementById('disp-address').innerText = state.address;
                document.getElementById('disp-flag').innerText = String.fromCodePoint(...state.countryCode.toUpperCase().split('').map(c => 127397 + c.charCodeAt()));
            });
    }

    function updateTime() {
        const n = new Date();
        document.getElementById('disp-date').innerText = `${n.toLocaleDateString('en-GB')} ${n.toLocaleTimeString('en-US')} ${n.toString().match(/GMT[\+\-]\d{4}/)[0]}`;
    }

    document.getElementById('snap-btn').onclick = async function() {
        this.classList.add('flash-pink');
        setTimeout(async () => {
            await takeFullResShot();
            this.classList.remove('flash-pink');
        }, 100);
    };

    async function takeFullResShot() {
        let bitmap;
        try {
            const capture = new ImageCapture(videoTrack);
            bitmap = await capture.grabFrame();
            CANVAS.width = bitmap.width;
            CANVAS.height = bitmap.height;
        } catch (e) {
            CANVAS.width = VIDEO.videoWidth;
            CANVAS.height = VIDEO.videoHeight;
        }

        CTX.save();
        if (currentFacingMode === 'user') {
            CTX.translate(CANVAS.width, 0); CTX.scale(-1, 1);
        }
        if (bitmap) CTX.drawImage(bitmap, 0, 0);
        else CTX.drawImage(VIDEO, 0, 0);
        CTX.restore();

        CTX.save();
        CTX.globalAlpha = 0.5;
        const logoSize = CANVAS.width * 0.15;
        const pad = CANVAS.width * 0.03;
        CTX.drawImage(WATERMARK_IMG, pad, pad, logoSize, logoSize);
        CTX.restore();

        const boxH = CANVAS.height * 0.20;
        const yS = CANVAS.height - boxH;
        CTX.fillStyle = "rgba(0,0,0,0.5)";
        CTX.fillRect(0, yS, CANVAS.width, boxH);

        const s = CANVAS.width / 1000;
        const mS = boxH * 0.7;
        const mX = 20 * s;
        const mY = yS + (boxH - mS) / 2;
        
        try { CTX.drawImage(document.getElementById('map-img'), mX, mY, mS, mS); } catch(e){}

        const tX = mX + mS + (20 * s);
        let tY = mY + (30 * s);
        CTX.fillStyle = "white"; CTX.shadowBlur = 4; CTX.shadowColor = "black";
        
        CTX.font = `bold ${35 * s}px Roboto`;
        CTX.fillText(document.getElementById('disp-title').innerText, tX, tY);
        
        tY += (40 * s);
        CTX.font = `${22 * s}px Roboto`;
        CTX.fillText((document.getElementById('disp-flag').innerText + " " + document.getElementById('disp-address').innerText).substring(0, 55), tX, tY);

        tY += (35 * s);
        CTX.font = `${20 * s}px monospace`;
        CTX.fillText(document.getElementById('disp-coords').innerText, tX, tY);

        tY += (35 * s);
        CTX.font = `bold ${20 * s}px Roboto`;
        CTX.fillStyle = "#eebb00";
        CTX.fillText(document.getElementById('disp-date').innerText, tX, tY);

        const link = document.createElement('a');
        link.download = `GeoSnap_ULTRA_${Date.now()}.jpg`;
        link.href = CANVAS.toDataURL("image/jpeg", 1.0);
        link.click();
    }

    window.onload = init;
</script>
</body>
</html>
